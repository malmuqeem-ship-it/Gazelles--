<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صح أم خطأ – غزال الريم والغزال الآدمي</title>

<style>
body{
  margin:0;
  font-family:"Noto Kufi Arabic", sans-serif;
  background:linear-gradient(#f9f6ee,#e8dcc3);
  display:flex;justify-content:center;align-items:center;
  height:100vh;text-align:center;color:#203228;
}

main{
  background:#fff9f0;
  padding:25px;
  border-radius:18px;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
  width:90%;max-width:600px;
}

h1{color:#2f6f4f;font-size:22px;}

#question{font-size:20px;margin:15px 0;}

img{
  max-width:250px;
  margin:10px auto;
  display:block;
  border-radius:12px;
}

button{
  margin:8px;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.b-true{background:#2d9d62;color:#fff;}
.b-false{background:#c85151;color:#fff;}

#startBtn{background:#1f6f8b;color:#fff;}
#nextBtn{display:none;background:#2f6f4f;color:#fff;}

#feedback{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  display:none;
  background:#fff;
  border:1px solid #ddd;
}

.ok{color:green;font-weight:bold;}
.bad{color:red;font-weight:bold;}

#end{display:none;margin-top:15px;}
</style>
</head>

<body>
<main>

<h1>صح أم خطأ – غزال الريم والغزال الآدمي</h1>

<p id="question">اضغطي "ابدئي" لعرض أول سؤال</p>

<div id="imageBox"></div>

<div>
  <button id="btnTrue" class="b-true" disabled>صح</button>
  <button id="btnFalse" class="b-false" disabled>خطأ</button>
</div>

<div id="feedback"></div>

<button id="nextBtn">التالي</button>
<button id="startBtn">ابدئي ▶</button>

<div id="end">
  <h3>انتهت اللعبة 🎉</h3>
  <p>نتيجتك: <span id="score"></span> من 6</p>
  <button onclick="location.reload()">إعادة</button>
</div>

</main>

<script>

const questions = [
{
q:"لون غزال الريم رملي فاتح وخطوطه الجانبية غير واضحة.",
a:true,
ex:"يتميّز غزال الريم بلونه الرملي الفاتح وخطوطه خفيفة."
},
{
q:"أنف الغزال الآدمي يخلو من العلامات الداكنة.",
a:false,
ex:"الغزال الآدمي لديه علامة داكنة واضحة على الأنف."
},
{
q:"الغزال الآدمي يتميّز بلون بني داكن مع خط جانبي أبيض.",
a:true,
ex:"هذه من أبرز صفاته."
},
{
q:"قرون الأنثى أطول من الذكر.",
a:false,
ex:"الذكر قرونه أوضح، الأنثى أقصر."
},
{
q:"غزال الريم من أكبر أنواع الغزلان.",
a:true,
ex:"يُعد من الأنواع الكبيرة."
},
{
q:"يعد المها العربي من الحيوانات المهددة بالانقراض.",
a:true,
   img:"https://www.aljazeera.net/wp-content/uploads/2022/03/GettyImages-720083475.jpg?resize=770%2C513",
ex:"المها العربي من الحيوانات المهددة بالانقراض."
}
];

let index = -1;
let score = 0;

const q = document.getElementById("question");
const fb = document.getElementById("feedback");
const t = document.getElementById("btnTrue");
const f = document.getElementById("btnFalse");
const n = document.getElementById("nextBtn");
const s = document.getElementById("startBtn");
const end = document.getElementById("end");
const imgBox = document.getElementById("imageBox");

function startGame(){
  s.style.display = "none";
  showQuestion();
}

function showQuestion(){
  index++;

  if(index >= questions.length){
    endGame();
    return;
  }

  let cur = questions[index];

  q.textContent = cur.q;

  imgBox.innerHTML = cur.img
    ? `<img src="${cur.img}">`
    : "";

  fb.style.display = "none";
  t.disabled = f.disabled = false;
  n.style.display = "none";
}

function check(ans){
  let cur = questions[index];
  let correct = (ans === cur.a);

  fb.style.display = "block";

  if(correct){
    fb.innerHTML = `<div class="ok">إجابة صحيحة ✅</div>${cur.ex}`;
    score++;
  } else {
    fb.innerHTML = `<div class="bad">إجابة خاطئة ❌</div>${cur.ex}`;
  }

  t.disabled = f.disabled = true;
  n.style.display = "inline-block";
}

function endGame(){
  q.textContent = "أحسنتِ! انتهت الأسئلة";
  imgBox.innerHTML = "";
  t.style.display = f.style.display = n.style.display = "none";
  fb.style.display = "none";
  end.style.display = "block";
  document.getElementById("score").textContent = score;
}

t.onclick = () => check(true);
f.onclick = () => check(false);
n.onclick = showQuestion;
s.onclick = startGame;

</script>

</body>
</html>
